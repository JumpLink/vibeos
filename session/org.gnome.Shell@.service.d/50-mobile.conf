# GNOME Shell mobile (gnome-shell-mobile + mutter-mobile, mobile-51) from /opt/gnome-mobile instead of Debian's;
# its binaries carry the runpath to its own libmutter, its GSettings schemas come first
[Service]
ExecStart=
ExecStart=/opt/gnome-mobile/bin/gnome-shell --mode=%i
Environment=GSETTINGS_SCHEMA_DIR=/opt/gnome-mobile/share/glib-2.0/schemas
