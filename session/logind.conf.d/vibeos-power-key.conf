# The power key held is the shell's: from half a second on it talks to Agent for as long as it is held, or opens the
# power menu (extension/power.js). Mobian's mobile-tweaks has logind power the phone off on a 5 s hold, which a long
# question to Agent reaches, so logind leaves the long press alone here (this file sorts after mobile-tweaks.conf).
# Power off and restart are in the power menu, power and volume up; a phone that answers nothing at all restarts by
# its own hardware reset, power and volume down held.
[Login]
HandlePowerKeyLongPress=ignore
