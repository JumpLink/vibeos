# A cover's lid switch is the shell's (extension/power.js): closed, the screen goes to sleep and locks as by the
# power key; opened, it wakes to the lock screen, as Android has it. logind would suspend instead, which a tablet
# here either does not allow (the Xiaomi Pad 5: a failed suspend, the screen left on) or is not to do on a cover, so
# it leaves the lid alone, on battery, on a charger and docked.
[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
