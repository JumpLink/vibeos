# /etc/geoclue/conf.d/50-vibeos-location.conf
# VibeOS: location comes from the phone's own GNSS only, with no online lookups (owner,
# 11-26). No Wi-Fi BSSIDs, cell IDs or IP address go to a location web service (beacondb /
# ichnaea), and no static file stands in for a fix. [modem-gps] (a modem's own GNSS through
# ModemManager: the POCO X3) stays on. [network-nmea] is off here: without an nmea-socket it
# browses the LAN over Avahi for NMEA services. On the S20 FE and the S10e the BCM4775 GNSS
# package's 90-vibeos-gnss.conf (read after this file) turns it on with its own socket.
# Application entries stay as geoclue.conf has them.
[ip]
enable=false
[wifi]
enable=false
[3g]
enable=false
[cdma]
enable=false
[static-source]
enable=false
[network-nmea]
enable=false
[modem-gps]
enable=true
