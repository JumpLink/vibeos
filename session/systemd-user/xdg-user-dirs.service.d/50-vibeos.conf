# VibeOS: the standard folders (Documents, Downloads, Music, Pictures …) have their English names in every language.
# xdg-user-dirs-update makes the ones a user lacks (all of them at the first login, a new kind such as Projects after
# an upgrade) untranslated, whatever the session's language. Folders that are there keep their names: nothing is
# renamed or moved.
[Service]
Environment=LC_ALL=C.UTF-8 LANGUAGE=
