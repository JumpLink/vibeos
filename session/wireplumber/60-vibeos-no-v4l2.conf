# PipeWire offers no plain V4L2 devices. WirePlumber 0.5's V4L2 monitor stops handling every device event, the sound
# cards' too, as soon as one /dev/video node refuses to open (a codec whose firmware may not load, a camera node that
# needs its pipeline set up first): no output, no input, only "Dummy Output", and every sound waits for nothing. VibeOS
# needs none of its nodes: Camera drives the cameras with libcamera itself, a browser's camera comes through the camera
# portal from WirePlumber's libcamera monitor, which stays, and the video codecs' nodes are not cameras.
#
# Read when WirePlumber starts: a change takes a reboot (or a new login), never a restart of PipeWire or WirePlumber
# under a running session.
wireplumber.profiles = {
  main = {
    monitor.v4l2 = disabled
  }
}
