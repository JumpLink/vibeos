# Bluetooth calls in a car or on a headset: the hands-free gateway PipeWire offers them (HFP AG, its native backend)
# takes the phone's calls from ModemManager, so a car kit shows a call and the caller, rings, and answers and hangs
# up with its own buttons, as with an Android phone (the call's indicators, its list, ATA, AT+CHUP). Without this
# PipeWire offers hands-free with no calls in it. "any": whichever modem ModemManager has.
#
# Read when PipeWire's Bluetooth monitor starts: a change takes a reboot (or a new login), never a restart of
# PipeWire or WirePlumber under a running session.
monitor.bluez.properties = {
  bluez5.hfphsp-backend-native-modem = "any"
}
