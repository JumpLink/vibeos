<?xml version="1.0"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- vibeos-wakeup (root) owns the name; every user's apps may ask it to wake the phone -->
<busconfig>
  <policy user="root">
    <allow own="vibeos.Wakeup"/>
  </policy>
  <policy context="default">
    <allow send_destination="vibeos.Wakeup"/>
  </policy>
</busconfig>
