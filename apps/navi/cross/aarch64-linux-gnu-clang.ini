# Cross-compiles the navi widget and demo for arm64 with the host's clang and lld. Give the arm64 root
# filesystem in a second cross file listed BEFORE this one:
#   [constants]
#   sysroot = '/path/to/arm64/root'
# meson setup --cross-file sysroot.ini --cross-file cross/aarch64-linux-gnu-clang.ini -Dmaplibre_stage=...
[binaries]
# --gcc-toolchain: see maplibre/aarch64-linux-gnu-clang.cmake (header paths through the /lib symlink)
c = ['clang', '--target=aarch64-linux-gnu', '--sysroot=' + sysroot, '--gcc-toolchain=' + sysroot + '/usr']
cpp = ['clang++', '--target=aarch64-linux-gnu', '--sysroot=' + sysroot, '--gcc-toolchain=' + sysroot + '/usr']
c_ld = 'lld'
cpp_ld = 'lld'
ar = 'llvm-ar'
strip = 'llvm-strip'
pkg-config = 'pkg-config'

[properties]
sys_root = sysroot
pkg_config_libdir = [sysroot + '/usr/lib/aarch64-linux-gnu/pkgconfig', sysroot + '/usr/share/pkgconfig']

[host_machine]
system = 'linux'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'
