SectionVerb {
	Value {
		TQ "Voice"
	}
}

SectionDevice."Earpiece" {
	Comment "Earpiece"
	Value {
		PlaybackPCM "hw:0,0"
	}
}

SectionDevice."Mic" {
	Comment "Microphone"
	Value {
		CapturePCM "hw:0,1"
	}
}

# the call, both sides
SectionModifier."Capture Voice" {
	Comment "Record the call"
	Value {
		CapturePCM "hw:0,4"
	}
}

# into the call's uplink
SectionModifier."Play Voice" {
	Comment "Play into the call"
	Value {
		PlaybackPCM "hw:0,5"
	}
}
