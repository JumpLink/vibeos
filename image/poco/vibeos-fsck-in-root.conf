# The root is checked here, not in the initramfs (fsck.mode=skip on the kernel command line, root mounted ro):
# U-Boot leaves the APSS watchdog running and nothing pets it until qcom_wdt loads from the root, so a long check
# in the initramfs would reset the phone mid-run, on every boot. Here PID 1 already pets the watchdog.
# fsck.mode=skip is read by systemd-fsck too; this unit's own credential overrides it. fsck.repair=yes on the
# command line makes it fsck -y. A file system it cannot repair does not stop the boot (no emergency shell on a
# phone): "-" makes any exit a success, so the unit's OnFailure=emergency.target never fires (a drop-in cannot
# remove it), and systemd-remount-fs mounts the root read-write anyway.
[Service]
SetCredential=fsck.mode:auto
ExecStart=
ExecStart=-/usr/lib/systemd/systemd-fsck
