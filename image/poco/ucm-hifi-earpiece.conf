
# The earpiece, for calls in apps (VoiceCall.conf's Earpiece is the modem's): the top amp (Left, tas2564@4d)
# alone, 10 dB down, the bottom one muted; both take the mix of both slots, as for the Speaker. On the Speaker's
# PCM, so PipeWire offers it as profiles of its own ("HiFi (Earpiece, Mic1)"), below the Speaker's in priority:
# WirePlumber's communication-profile.lua picks one while an app plays a call (vibeos-device-poco).
SectionDevice."Earpiece" {
	Comment "Earpiece"

	ConflictingDevice [
		"Speaker"
	]

	EnableSequence [
		cset "name='Left ASI1 Sel' LeftRightDiv2"
		cset "name='Right ASI1 Sel' LeftRightDiv2"
		cset "name='Left Digital Volume Control' 98"
		cset "name='Right Digital Volume Control' 0"
	]

	DisableSequence [
		cset "name='Left Digital Volume Control' 108"
		cset "name='Right Digital Volume Control' 108"
	]

	Value {
		PlaybackPriority 50
		PlaybackPCM "hw:${CardId},0" # MultiMedia1
		PlaybackChannels 1
	}
}
