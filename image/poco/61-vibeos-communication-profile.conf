# VibeOS: calls on the earpiece, as on Android (scripts/vibeos/communication-profile.lua). While an app plays a call
# (media.role "Communication", or PulseAudio's "phone"), the card's profile with its earpiece in place of the
# loudspeaker is chosen; when the call ends, the usual one comes back. Only the cards that say which UCM device is
# their earpiece take part: this phone's, below.
#
# The script is wanted by a virtual component of its own, which the main profile requires: if it cannot load,
# WirePlumber says so and goes on without it, calls on the loudspeaker as before.
wireplumber.components = [
  {
    name = vibeos/communication-profile.lua, type = script/lua
    provides = script.device.vibeos-communication-profile
  }
  {
    type = virtual, provides = policy.device.vibeos-communication-profile
    wants = [ script.device.vibeos-communication-profile ]
  }
]

wireplumber.profiles = {
  main = {
    policy.device.vibeos-communication-profile = required
  }
}

# The POCO X3 NFC: HiFi.conf's "Earpiece" (the top amp alone) next to its "Speaker" (both amps)
monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "alsa_card.platform-sound"
      }
    ]
    actions = {
      update-props = {
        vibeos.communication-device = "Earpiece"
      }
    }
  }
]
