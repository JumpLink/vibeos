# Xiaomi Pad 5: WirePlumber's libcamera monitor is off. With it on, WirePlumber keeps libcamera's camera manager
# running and the camera subsystem's devices open for as long as it runs, and on this tablet the subsystem then
# never goes idle, with a camera in use or not. Camera drives the cameras with libcamera itself and needs no
# monitor. Without it PipeWire offers no camera, so the camera portal (a browser's camera, a sandboxed app's)
# has none on this tablet.
#
# Read when WirePlumber starts: a change takes a reboot (or a new login), never a restart of PipeWire or WirePlumber
# under a running session.
wireplumber.profiles = {
  main = {
    monitor.libcamera = disabled
  }
}
