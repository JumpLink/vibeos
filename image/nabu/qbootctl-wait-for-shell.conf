# qbootctl.service marks the boot slot good, so that the bootloader stops counting its retries. As shipped it does
# so right after sysinit (boot-complete.target, which nothing holds back here: systemd-boot-check-no-failures stays
# off, since one unrelated failed unit would send every boot back to the other slot). Here the slot is marked only
# once a GNOME Shell runs on seat0, the greeter's or a user's (wait-for-shell): a boot that hangs before it, or a
# shell that keeps crashing, is not marked, and after its retries the bootloader goes back to LineageOS in slot a.
[Unit]
After=graphical.target

[Service]
ExecStartPre=/usr/libexec/vibeos-device/wait-for-shell 120
TimeoutStartSec=180
