# VibeOS runs on GNOME Shell mobile (gnome-shell-mobile + mutter-mobile, mobile-51) from /opt/gnome-mobile, as on the
# S10e and our POCO: Debian's stock gnome-shell 51 crashed (SEGV) right after the lock screen's unlock with the
# extension (2026-11-12). Installed by build-system.sh as
# /etc/systemd/user/org.gnome.Shell@vibeos.service.d/50-mobile.conf (the session is "vibeos"; gnome-phone's was
# "gnome-phone" until 2026-11-16)
[Service]
ExecStart=
ExecStart=/opt/gnome-mobile/bin/gnome-shell --mode=%i
Environment=GSETTINGS_SCHEMA_DIR=/opt/gnome-mobile/share/glib-2.0/schemas
