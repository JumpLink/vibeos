# 81voltd looks for ModemManager's modem once, when it starts, and stays idle without it; ModemManager needs some
# seconds after its own start to find the modem, so wait for it here (81voltd-wait-modem.conf, from vibeos)
[Service]
ExecStartPre=/bin/sh -c 'i=0; while [ $$i -lt 90 ]; do mmcli -L 2>/dev/null | grep -q /Modem/ && exit 0; i=$$((i + 1)); sleep 1; done; echo "no modem from ModemManager after 90 s"'
TimeoutStartSec=120
