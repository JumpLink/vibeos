Syntax 7

SectionUseCase."HiFi" {
	File "/conf.d/S10e/HiFi.conf"
	Comment "Play HiFi quality Music"
}

# Only with a kernel that has the call's own PCMs (hw:,4 "Call Record" first).
# Syntax 7: a Path condition expands ${CardNumber} from v7 on.
If.voicecall {
	Condition {
		Type Path
		Path "/proc/asound/card${CardNumber}/pcm4c"
		Mode exist
	}
	True {
		SectionUseCase."Voice Call" {
			File "/conf.d/S10e/VoiceCall.conf"
			Comment "Phone call"
		}
	}
}
