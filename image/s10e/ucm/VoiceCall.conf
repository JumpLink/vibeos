# A phone call, as exynos-callaudio sets it up: the ABOX firmware carries the
# call between the modem, the mics and the amps, and exynos-callaudiod picks
# the earpiece or the loudspeaker, so nothing here sets a control. The PCMs
# are the call's own (exynos9820-abox):
#   hw:,6 "Call Local"   what this phone plays during the call, mixed with
#                        the other side, wherever the call is routed
#   hw:,4 "Call Record"  both sides: this phone left, the other side right
#   hw:,5 "Call Voice"   into the call in place of the mics, while it has sound
# Profile priority stays under HiFi's, so the card is in this verb only while
# exynos-callaudio puts it there. The modifiers name no SupportedDevice: a sound
# server may enable them before the device, and they have nothing to set.

SectionVerb {
	Value {
		TQ "Voice"
		Priority 10
	}
}

SectionDevice."Earpiece" {
	Comment "Call audio"

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},6"
		PlaybackChannels 2
	}
}

SectionModifier."Capture Voice" {
	Comment "Record the call"

	Value {
		CapturePCM "hw:${CardId},4"
		CaptureChannels 2
	}
}

SectionModifier."Play Voice" {
	Comment "Play into the call"

	Value {
		PlaybackPCM "hw:${CardId},5"
		PlaybackChannels 4
	}
}
