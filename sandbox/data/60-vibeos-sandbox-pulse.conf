# VibeOS: no PulseAudio client loads modules into pipewire-pulse. An app in vibeos-sandbox reaches pipewire-pulse
# through the PulseAudio socket, and a module it loaded would run outside the sandbox with everything pipewire-pulse
# may do: a loopback from the microphone into a pipe sink writing to a file the app can read is a recording without
# the microphone permission. pipewire-pulse cannot tell one client from another here, so the switch is for all of
# them; the modules pipewire-pulse loads for itself (pulse.cmd) are not affected.
pulse.properties = {
  pulse.allow-module-loading = false
}
