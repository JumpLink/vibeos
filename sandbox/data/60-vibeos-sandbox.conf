# VibeOS: what apps in vibeos-sandbox see of PipeWire (scripts/vibeos/sandbox-access.lua). It loads with
# WirePlumber, at the start of the session; it hides the microphones and cameras from sandboxed apps even when the
# permission store is not there, so it only "wants" it. It asks the shell for the microphone through WirePlumber's
# device reservation (a bus name), which it wants too: without it a sandboxed app that records without an answer
# stored is refused at once instead.
#
# WirePlumber loads only what a profile requires and what that wants: the script is wanted by a virtual component of
# its own, which the main profile requires. A virtual component always loads, so if the script cannot (a newer
# WirePlumber without its Lua API), WirePlumber says so and goes on without it, sound and calls as before.
wireplumber.components = [
  {
    name = vibeos/sandbox-access.lua, type = script/lua
    provides = script.client.access-vibeos-sandbox
    wants = [ support.portal-permissionstore support.reserve-device ]
  }
  {
    type = virtual, provides = policy.client.access-vibeos-sandbox
    wants = [ script.client.access-vibeos-sandbox ]
  }
]

wireplumber.profiles = {
  main = {
    policy.client.access-vibeos-sandbox = required
  }
}
